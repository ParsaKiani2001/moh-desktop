<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Window Manager UI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="themes/dark.css" id="theme">
</head>
<body>
    <!-- Title Bar Template -->
    <div class="titlebar" id="titlebar">
        <div class="title" id="title">Window</div>
        
        <div class="controls">
            <button class="btn btn-min" data-action="minimize" title="Minimize">─</button>
            <button class="btn btn-max" data-action="maximize" title="Maximize">□</button>
            <button class="btn btn-close" data-action="close" title="Close">✕</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
